name: Tiny Buddha Posts

on:
  schedule:
    - cron: '0 8 * * *'  
    - cron: '0 12 * * *'  
    - cron: '0 17 * * *'  
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        run: python scripts/fetch_news.py
