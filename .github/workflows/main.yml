name: Psychology Posts

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 МСК (Факт про эго)
    - cron: '0 9 * * *'   # 12:00 МСК (Как найти себя)
    - cron: '0 14 * * *'  # 17:00 МСК (Выгорание)
    - cron: '0 16 * * *'  # 19:00 МСК (Личная жизнь)
  workflow_dispatch: {}   # Кнопка для ручного запуска

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run script
        env:
          # Теперь токены берутся из секретов репозитория
          TG_TOKEN: "9093268140:AAHDUn5S9kg99ROBD9UMrytd0uWj5dQPlI0"
          TG_CHAT_ID: "-1004376020976"
          MYMEMORY_EMAIL: "kulepoveldar666@gmail.com" 
        run: python scripts/fetch_news.py

      - name: Commit sent_news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.json || true
          git diff --cached --quiet || git commit -m "chore: update sent_news.json [skip ci]"
          git push || true
